<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
_baseVals() { const ok = !!this.fv('aname'); return { saveOff: !ok, saveOp: ok ? 1 : 0.45, saveAddr: () => { if (ok) this.setState({ fx: {} }); } }; }

  _fields() { return {"aname":{"v":["","บ้านแม่","ออฟฟิศ"],"ph":"ชื่อสถานที่ เช่น บ้านแม่","on":"var(--tx)","mask":false},"anote":{"v":["","ตึก B กดกริ่ง 12","จอดรถหน้าร้านสะดวกซื้อ"],"ph":"หมายเหตุ เช่น ตึก B กดกริ่ง 12","on":"var(--tx)","mask":false}}; }
  fv(k) { const F = this._fields()[k]; const fx = (this.state && this.state.fx) || {}; const v = F.v[(fx[k] || 0) % F.v.length]; return v.indexOf('HOLE:') === 0 ? String((this._hole || {})[v.slice(5)] || '') : v; }
  renderVals() {
    const r = this._baseVals(); this._hole = r; const fx = (this.state && this.state.fx) || {}; const F = this._fields();
    Object.keys(F).forEach((k) => {
      const v = this.fv(k), c = F[k];
      const o = { text: v ? (c.mask ? '\u2022'.repeat(v.length) : v) : c.ph, color: v ? c.on : '#7d6d6a', tap: () => this.setState({ fx: Object.assign({}, fx, { [k]: ((fx[k] || 0) + 1) % c.v.length }) }) };
      for (let i = 0; i < 6; i++) o['d' + i] = v[i] || '\u2013';
      r[k] = o;
    });
    return r;
  }
}
</script>
