<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>นัดเพื่อน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e3c35c}a:hover{color:#eed58a}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #d4af37;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0e0a0a; color: #f6efe4; font-family: 'IBM Plex Sans Thai', sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px"><a href="Profile.dc.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #33272a; display: grid; place-items: center; color: #f6efe4; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg></a><div style="font-family: Kanit; font-weight: 600; font-size: 18px">นัดเพื่อน</div></div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 18px; font-size: 11.5px; text-align: center">
    <div style="padding-bottom: 8px; border-bottom: 2px solid #d4af37; color: #e3c35c">1 · บริการ</div>
    <div style="padding-bottom: 8px; border-bottom: 2px solid #d4af37; color: #f6efe4; font-weight: 600">2 · สถานที่</div>
    <div style="padding-bottom: 8px; border-bottom: 2px solid #33272a; color: #7d6d6a">3 · ยืนยันและชำระ</div>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 16px 18px 110px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; border: 1px solid #33272a; background: #181212">
      <img src="/_blob/551eb82924983c941f1fe44ede9bceca" alt="ต้น" style="width: 50px; height: 50px; border-radius: 14px; object-fit: cover">
      <div style="flex: 1"><div style="font-family: Kanit; font-weight: 600; font-size: 16px">ต้น <span style="color: #e3c35c; font-size: 12px">★ 5.0</span></div><div style="font-size: 12px; color: #ab9d94">ทองหล่อ · ว่างตอนนี้</div></div>
    </div>
    <h2 style="margin: 0; font-family: Kanit; font-weight: 600; font-size: 17px">ระยะเวลา</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="2">
        <button onClick="{{b.pick}}" style="padding: 14px 10px; border-radius: 16px; border: 1.5px solid {{b.border}}; background: {{b.bg}}; color: #f6efe4; text-align: center"><span style="display: block; font-size: 12.5px; color: #d3c7bc">{{b.label}}</span><span style="display: block; font-family: Kanit; font-weight: 700; font-size: 22px; color: {{b.priceColor}}">{{b.price}}</span></button>
      </sc-for>
    </div>
    <h2 style="margin: 4px 0 0; font-family: Kanit; font-weight: 600; font-size: 17px">เจอกันที่ไหนดี</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{places}}" as="pl" hint-placeholder-count="7"><button onClick="{{pl.pick}}" aria-pressed="{{pl.on}}" style="padding: 11px 12px; border-radius: 14px; border: 1.5px solid {{pl.border}}; background: {{pl.bg}}; color: #f6efe4; text-align: left"><span style="display: block; font-weight: 600; font-size: 13.5px">{{pl.label}}</span><span style="display: block; font-size: 11px; color: #ab9d94">{{pl.sub}}</span></button></sc-for>
    </div>
    <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="height: 130px; border-radius: 16px; border: 1px solid #33272a; overflow: hidden; position: relative; background: repeating-linear-gradient(0deg, #130e0e 0 22px, #181212 22px 23px), #130e0e">
          <div style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 30px, rgba(51,39,42,.7) 30px 31px)"></div>
          <div style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50% 50% 50% 0; rotate: -45deg; background: #b0182c; border: 2px solid #f6efe4"></div>
          <div style="position: absolute; left: 10px; bottom: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(8,6,6,.8); font-size: 11px; color: #d3c7bc">ใช้ตำแหน่งปัจจุบัน</div>
        </div>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #ab9d94">ชื่ออาคาร / ห้อง<button type="button" onClick="{{room.tap}}" aria-label="ชื่ออาคาร / เลขห้อง · แตะเพื่อกรอกตัวอย่าง" style="display:flex;align-items:center;justify-content:flex-start;text-align:left;cursor:pointer;box-sizing:border-box;font-family:inherit;overflow:hidden;white-space:nowrap;height: 46px; border-radius: 14px; border: 1px solid #33272a; background: #181212; padding: 0 14px; font-size: 14px; color:{{room.color}}">{{room.text}}</button></label>
      </div>
    </sc-if>
    <sc-if value="{{isMeet}}" hint-placeholder-val="{{ false }}">
      <label style="display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #ab9d94">จุดนัดพบ ({{place}})<button type="button" onClick="{{meet.tap}}" aria-label="meet · แตะเพื่อกรอกตัวอย่าง" style="display:flex;align-items:center;justify-content:flex-start;text-align:left;cursor:pointer;box-sizing:border-box;font-family:inherit;overflow:hidden;white-space:nowrap;height: 46px; border-radius: 14px; border: 1px solid #33272a; background: #181212; padding: 0 14px; font-size: 14px; color:{{meet.color}}">{{meet.text}}</button><span style="font-size:11px;color:#7d6d6a;font-weight:400">แตะเพื่อกรอกตัวอย่าง</span></label>
    </sc-if>
    <sc-if value="{{isSpa}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 12px; color: #ab9d94">เลือกสปา / สถานที่พาร์ทเนอร์</div>
        <sc-for list="{{spas}}" as="p" hint-placeholder-count="3">
          <button onClick="{{p.pick}}" style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; border: 1.5px solid {{p.border}}; background: #181212; color: #f6efe4; text-align: left">
            <img src="/_blob/3955daa362c2a71ec8e36d56b540838e" alt="" style="width: 58px; height: 58px; border-radius: 12px; object-fit: cover">
            <span style="flex: 1"><span style="display: block; font-weight: 600; font-size: 14px">{{p.name}}</span><span style="display: block; font-size: 11.5px; color: #ab9d94">{{p.meta}}</span></span>
            <span style="font-size: 12px; color: #e3c35c">{{p.fee}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 18px 18px; background: rgba(14,10,10,.97); border-top: 1px solid #33272a; display: flex; align-items: center; justify-content: space-between">
    <div><div style="font-size: 11px; color: #ab9d94">{{summary}}</div><div style="font-family: Kanit; font-weight: 700; font-size: 22px; color: #e3c35c">{{total}}</div></div>
    <a href="N02-Schedule.dc.html" style="height: 52px; padding: 0 28px; border-radius: 999px; background: linear-gradient(180deg, #c21d33, #8f1424); border: 1px solid rgba(212,175,55,.45); color: #fff; font-weight: 600; text-decoration: none; display: flex; align-items: center">ถัดไป</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { h: 3, place: 'คอนโด', spa: 0 }; }
  _baseVals() {
    const s = this.state; const gold = '#d4af37';
    const price = { 3: 2400, 5: 3800 };
    const spas = [
      { name: 'Siam Serenity Spa', meta: 'สุขุมวิท 31 · 1.8 กม. · ★ 4.9', fee: '+฿600 ค่าห้อง' },
      { name: 'Lanna Retreat', meta: 'พร้อมพงษ์ · 2.6 กม. · ★ 4.8', fee: '+฿500 ค่าห้อง' },
      { name: 'Baan Suan Spa', meta: 'อารีย์ · 5.1 กม. · ★ 4.7', fee: '+฿450 ค่าห้อง' }
    ];
    const PL = [['นอกสถานที่', 'ทริป · ไปด้วยกัน', 'จุดนัดรับ เช่น BTS ทองหล่อ'], ['กลางแจ้ง', 'สวน · ริมน้ำ', 'เช่น สวนเบญจกิติ ประตู 1'], ['ห้าง', 'ห้างสรรพสินค้า', 'เช่น EmQuartier ชั้น G'], ['คาเฟ่ / ร้านอาหาร', 'ร้านที่คุณเลือก', 'ชื่อร้าน / สาขา'], ['คอนโด', 'ที่พักของฉัน', ''], ['โรงแรม', 'ห้องพัก / ล็อบบี้', ''], ['สปา', 'สถานที่พาร์ทเนอร์', '']];
    const isRoom = s.place === 'คอนโด' || s.place === 'โรงแรม';
    const roomFee = s.place === 'สปา' ? [600, 500, 450][s.spa] : 0;
    const total = price[s.h] + roomFee;
    return {
      blocks: [3, 5].map((h) => ({ label: 'นัด ' + h + ' ชม.', price: '฿' + price[h].toLocaleString('en-US'), border: s.h === h ? gold : '#33272a', bg: s.h === h ? 'rgba(212,175,55,.08)' : '#181212', priceColor: s.h === h ? '#e3c35c' : '#f6efe4', pick: () => this.setState({ h }) })),
      isHome: isRoom, isSpa: s.place === 'สปา', isMeet: !isRoom && s.place !== 'สปา', place: s.place,
      meetHint: (PL.find((p) => p[0] === s.place) || PL[0])[2],
      places: PL.map(([label, sub]) => { const on = s.place === label; return { label, sub, on: String(on), border: on ? '#c9283d' : '#33272a', bg: on ? 'rgba(176,24,44,.14)' : '#181212', pick: () => this.setState({ place: label }) }; }),
      spas: spas.map((p, i) => ({ ...p, border: s.spa === i ? gold : '#33272a', pick: () => this.setState({ spa: i }) })),
      summary: s.h + ' ชม.' + ' · ' + (s.place === 'สปา' ? spas[s.spa].name : s.place),
      total: '฿' + total.toLocaleString('en-US')
    };
  }

  _fields() { return {"room":{"v":["The Lofts Ekkamai · ห้อง 1205","Park Origin ทองหล่อ · ห้อง 3304",""],"ph":"ชื่ออาคาร / เลขห้อง","on":"#f6efe4","mask":false},"meet":{"v":["","BTS ทองหล่อ ทางออก 3","ล็อบบี้ชั้น G หน้าลิฟต์","ร้านกาแฟหน้าอาคาร"],"ph":"HOLE:meetHint","on":"#f6efe4","mask":false}}; }
  fv(k) { const F = this._fields()[k]; const fx = (this.state && this.state.fx) || {}; const v = F.v[(fx[k] || 0) % F.v.length]; return v.indexOf('HOLE:') === 0 ? String((this._hole || {})[v.slice(5)] || '') : v; }
  renderVals() {
    const r = this._baseVals(); this._hole = r; const fx = (this.state && this.state.fx) || {}; const F = this._fields();
    Object.keys(F).forEach((k) => {
      const v = this.fv(k), c = F[k];
      const o = { text: v ? (c.mask ? '\u2022'.repeat(v.length) : v) : (c.ph.indexOf('HOLE:') === 0 ? String(r[c.ph.slice(5)] || '') : c.ph), color: v ? c.on : '#7d6d6a', tap: () => this.setState({ fx: Object.assign({}, fx, { [k]: ((fx[k] || 0) + 1) % c.v.length }) }) };
      for (let i = 0; i < 6; i++) o['d' + i] = v[i] || '\u2013';
      r[k] = o;
    });
    return r;
  }
}
</script>
</body>
</html>
