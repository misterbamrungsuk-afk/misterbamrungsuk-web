<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>บัญชีรับเงิน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Kanit:wght@500;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box;font-variant-numeric:lining-nums}
a{color:#8e6a0d}a:hover{color:#997000}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #8e6a0d;outline-offset:2px}
.h{font-family:Kanit,sans-serif;font-weight:600}
.box{padding:18px;border-radius:16px;background:rgba(252,245,247,.45);min-width:0;overflow-wrap:anywhere}
.mut{color:#594836}
.sec{color:#3b2b19}
.cta{min-height:56px;width:100%;border-radius:16px;background:linear-gradient(100deg,#9e1028,#c8102e 50%,#9e1028);border:1.5px solid #8e6a0d;color:#fff;font-family:Kanit,sans-serif;font-weight:600;font-size:17px;display:grid;place-items:center;text-decoration:none;text-align:center;padding:0 16px}
.cta:hover{color:#000000}
.ghost{min-height:48px;width:100%;border-radius:14px;border:1px solid rgba(201,162,74,.55);background:rgba(252,245,247,.45);color:#8e6a0d;font-size:15px;font-weight:600;display:grid;place-items:center;text-decoration:none}
.lb{display:block;font-size:13px;color:#594836;margin-bottom:6px}
.in{min-height:48px;width:100%;border-radius:12px;border:1px solid rgba(201,162,74,.28);background:rgba(252,245,247,.55);color:#170f04;padding:0 14px;font-size:15px;display:flex;align-items:center;text-align:left}
</style>
</helmet>
<div style="width: 390px; height: 920px; background: linear-gradient(180deg, #fbf1f3 0%, #faecee 45%, #fbeef0 75%, #fcf2f5 100%); color: #170f04; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 15px; line-height: 1.7; position: relative; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: #faf6f7">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 20px; text-decoration: none"><img src="logo.png" alt="Mister Bamrungsuk" style="width: 40px; height: 40px; object-fit: contain"><span style="color: #846215">Mister Bamrungsuk</span></a>
    <span style="flex-shrink: 0; padding: 5px 12px; border-radius: 999px; border: 1px solid #c9a24a; font-size: 10px; letter-spacing: 2.5px; color: #8e6a0d">PREMIUM</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px"><a href="D2-KYC2.dc.html" aria-label="ย้อนกลับ" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: rgba(252,245,247,.45); color: #170f04; display: grid; place-items: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg></a><div style="min-width: 0"><div style="font-size: 13px; color: #8e6a0d">ขั้นที่ 5 / 5</div><div class="h" style="font-size: 20px; line-height: 1.35">บัญชีรับเงิน</div></div></div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 4px; padding: 0 20px"><span style="height: 4px; border-radius: 2px; background: #8e6a0d"></span><span style="height: 4px; border-radius: 2px; background: #8e6a0d"></span><span style="height: 4px; border-radius: 2px; background: #8e6a0d"></span><span style="height: 4px; border-radius: 2px; background: #8e6a0d"></span><span style="height: 4px; border-radius: 2px; background: #8e6a0d"></span></div>
  <div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px"><button type="button" onClick="{{toBank}}" aria-pressed="{{bankOn}}" style="min-height: 48px; border-radius: 12px; border: 1px solid {{bankBd}}; background: {{bankBg}}; color: {{bankFg}}; font-size: 15px">บัญชีธนาคาร</button><button type="button" onClick="{{toPp}}" aria-pressed="{{ppOn}}" style="min-height: 48px; border-radius: 12px; border: 1px solid {{ppBd}}; background: {{ppBg}}; color: {{ppFg}}; font-size: 15px">พร้อมเพย์</button></div>
    <sc-if value="{{isBank}}" hint-placeholder-val="{{ true }}"><label style="display: block"><span class="lb">ธนาคาร</span><select class="in"><optgroup label="ธนาคารพาณิชย์"><option>กสิกรไทย (KBank)</option><option>กรุงเทพ (BBL)</option><option>กรุงไทย (KTB)</option><option>ไทยพาณิชย์ (SCB)</option><option>กรุงศรีอยุธยา (BAY)</option><option>ทหารไทยธนชาต (ttb)</option><option>ยูโอบี (UOB)</option><option>ซีไอเอ็มบี ไทย (CIMB Thai)</option><option>เกียรตินาคินภัทร (KKP)</option><option>ทิสโก้ (TISCO)</option><option>แลนด์ แอนด์ เฮ้าส์ (LH Bank)</option><option>ไอซีบีซี (ไทย) (ICBC Thai)</option><option>ไทยเครดิต (Thai Credit)</option><option>สแตนดาร์ดชาร์เตอร์ด (ไทย)</option><option>แบงก์ออฟไชน่า (ไทย)</option></optgroup><optgroup label="ธนาคารของรัฐ"><option>ออมสิน (GSB)</option><option>ธ.ก.ส. (BAAC)</option><option>อาคารสงเคราะห์ (GH Bank)</option><option>อิสลามแห่งประเทศไทย (ibank)</option></optgroup></select></label></sc-if>
    <div><span class="lb">{{acctLabel}}</span><button type="button" class="in" onClick="{{acct.tap}}" aria-label="เลขบัญชี · แตะเพื่อกรอกตัวอย่าง" style="color: {{acct.color}}; overflow: hidden; white-space: nowrap">{{acct.text}}</button></div>
    <div><span class="lb">ชื่อบัญชี (ต้องตรงกับบัตรประชาชน)</span><button type="button" class="in" onClick="{{acctName.tap}}" aria-label="ชื่อบัญชี · แตะเพื่อกรอกตัวอย่าง" style="color: {{acctName.color}}; overflow: hidden; white-space: nowrap">{{acctName.text}}</button></div>
    <sc-if value="{{isBank}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px" class="mut"><span>รูปหน้าสมุดบัญชี (ไม่บังคับ)</span><span style="color: #8e6a0d">แนบรูป</span></div></sc-if>
    <div class="box sec" style="font-size: 14px; line-height: 1.6">รายได้เข้ากระเป๋าเงินหลังจบงาน ถอนเข้าบัญชีนี้ได้ทุกเมื่อ (ขั้นต่ำ ฿300)</div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; flex-direction: column; gap: 12px">
    <a href="JoinDone.dc.html" class="cta">ยืนยัน · ส่งใบสมัคร</a>
    <div class="mut" style="font-size: 13px; text-align: center">แอดมินตรวจภายใน 24 ชม. แล้วแจ้งผลทางแอปและ LINE</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  _baseVals() {
    const pp = this.state && this.state.mode === 'pp';
    const on = { bd: '#c9a24a', bg: 'rgba(142,106,13,.14)', fg: '#8e6a0d' }, off = { bd: 'transparent', bg: 'rgba(252,245,247,.45)', fg: '#3b2b19' };
    const b = pp ? off : on, q = pp ? on : off;
    return { isBank: !pp, acctLabel: pp ? 'เบอร์พร้อมเพย์ / เลขบัตรประชาชน' : 'เลขบัญชี',
      bankOn: String(!pp), ppOn: String(pp), bankBd: b.bd, bankBg: b.bg, bankFg: b.fg, ppBd: q.bd, ppBg: q.bg, ppFg: q.fg,
      toBank: () => this.setState({ mode: 'bank' }), toPp: () => this.setState({ mode: 'pp' }) };
  }

  _fields() { return {"acct":{"v":["123-4-56789-0",""],"ph":"xxx-x-xxxxx-x"},"acctName":{"v":["นายพงศกร รุ่งเรือง",""],"ph":"ชื่อ-นามสกุลตามบัตร"}}; }
  _fx(r) {
    const fx = (this.state && this.state.fx) || {}; const F = this._fields();
    Object.keys(F).forEach((k) => { const c = F[k]; const v = c.v[(fx[k] || 0) % c.v.length]; r[k] = { text: v || c.ph, color: v ? '#170f04' : '#8d7975', tap: () => this.setState({ fx: Object.assign({}, fx, { [k]: ((fx[k] || 0) + 1) % c.v.length }) }) }; });
    return r;
  }
  renderVals() { return this._fx(this._baseVals()); }
}
</script>
</body>
</html>
