<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ตารางอบรม</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Kanit:wght@500;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box;font-variant-numeric:lining-nums}
a{color:#8e6a0d}a:hover{color:#997000}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #8e6a0d;outline-offset:2px}
.h{font-family:Kanit,sans-serif;font-weight:600}
.box{padding:18px;border-radius:16px;background:rgba(252,245,247,.45);min-width:0;overflow-wrap:anywhere}
.mut{color:#594836}
.sec{color:#3b2b19}
.cta{min-height:56px;width:100%;border-radius:16px;background:linear-gradient(100deg,#9e1028,#c8102e 50%,#9e1028);border:1.5px solid #8e6a0d;color:#fff;font-family:Kanit,sans-serif;font-weight:600;font-size:17px;display:grid;place-items:center;text-decoration:none;text-align:center;padding:0 16px}
.cta:hover{color:#000000}
.ghost{min-height:48px;width:100%;border-radius:14px;border:1px solid rgba(201,162,74,.55);background:rgba(252,245,247,.45);color:#8e6a0d;font-size:15px;font-weight:600;display:grid;place-items:center;text-decoration:none}
.lb{display:block;font-size:13px;color:#594836;margin-bottom:6px}
.in{min-height:48px;width:100%;border-radius:12px;border:1px solid rgba(201,162,74,.28);background:rgba(252,245,247,.55);color:#170f04;padding:0 14px;font-size:15px;display:flex;align-items:center;text-align:left}
</style>
</helmet>
<div style="width: 390px; height: 908px; background: linear-gradient(180deg, #fbf1f3 0%, #faecee 45%, #fbeef0 75%, #fcf2f5 100%); color: #170f04; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 15px; line-height: 1.7; position: relative; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: #faf6f7">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 20px; text-decoration: none"><img src="logo.png" alt="Mister Bamrungsuk" style="width: 40px; height: 40px; object-fit: contain"><span style="color: #846215">Mister Bamrungsuk</span></a>
    <span style="flex-shrink: 0; padding: 5px 12px; border-radius: 999px; border: 1px solid #c9a24a; font-size: 10px; letter-spacing: 2.5px; color: #8e6a0d">PREMIUM</span>
  </div>
  <div style="height: 844px; overflow-y: auto; padding-bottom: 28px">
    <div style="padding: 20px 20px 0; display: flex; align-items: center; gap: 12px">
      <a href="JoinDone.dc.html" aria-label="ย้อนกลับ" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: rgba(252,245,247,.45); color: #170f04; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg></a>
      <div style="min-width: 0"><div class="h" style="font-size: 20px; line-height: 1.35">ตารางอบรม กลุ่ม 1</div><div class="mut" style="font-size: 13px">15–16 พ.ย. 2569 · MB Studio ทองหล่อ</div></div>
    </div>
    <div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 14px">
      <div class="box"><div style="display: flex; justify-content: space-between"><span>เข้าร่วมแล้ว</span><span class="h" style="color: #8e6a0d">{{doneLabel}}</span></div><div style="height: 8px; border-radius: 99px; background: rgba(252,245,247,.6); margin-top: 10px; overflow: hidden"><div style="width: {{pct}}; height: 100%; background: #8e6a0d"></div></div><div class="mut" style="font-size: 13px; margin-top: 8px">เข้าครบ 4 รอบหลักก็เริ่มรับงานได้</div></div>
      <sc-for list="{{sessions}}" as="x" hint-placeholder-count="5">
        <div class="box" style="display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid {{x.bd}}">
          <div style="width: 48px; text-align: center; flex: 0 0 48px"><div class="h" style="font-size: 20px; line-height: 1.2; color: #8e6a0d">{{x.day}}</div><div class="mut" style="font-size: 13px">{{x.mon}}</div></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600; line-height: 1.5">{{x.title}}</span><span class="mut" style="font-size: 13px">{{x.meta}}</span></div>
          <button onClick="{{x.tap}}" style="min-width: 84px; min-height: 44px; border-radius: 12px; border: {{x.btnBd}}; background: {{x.btnBg}}; color: {{x.btnFg}}; font-size: 13px; font-weight: 600">{{x.btn}}</button>
        </div>
      </sc-for>
      <div class="mut" style="font-size: 13px; text-align: center">เช็กชื่อที่สถานที่อบรมได้ตั้งแต่ 30 นาทีก่อนเริ่ม</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":908}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { done: [true, false, false, false, false] }; }
  renderVals() {
    const s = this.state; const n = s.done.filter(Boolean).length; const next = s.done.indexOf(false);
    const S = [['15', 'พ.ย.', 'ปฐมนิเทศและมารยาทบริการ', '09:00–12:00'], ['15', 'พ.ย.', 'บุคลิกภาพและการดูแลลูกค้า', '13:00–17:00'], ['16', 'พ.ย.', 'ความปลอดภัยและ SOS', '09:00–11:00'], ['16', 'พ.ย.', 'มาตรฐานการนวด (สายนวด)', '11:00–14:00'], ['16', 'พ.ย.', 'ทดสอบและถ่ายรูปโปรไฟล์', '14:30–17:00']];
    return {
      doneLabel: n + ' / 5 รอบ', pct: (n / 5 * 100) + '%',
      sessions: S.map(([day, mon, title, meta], i) => {
        const d = s.done[i]; const open = i === next;
        return { day, mon, title, meta, bd: open ? '#c9a24a' : 'transparent',
          btn: d ? 'เช็กชื่อแล้ว' : open ? 'เช็กชื่อ' : 'ยังไม่เปิด',
          btnBg: d ? 'rgba(85,195,135,.14)' : open ? 'linear-gradient(100deg, #9e1028, #c8102e 50%, #9e1028)' : 'rgba(252,245,247,.55)',
          btnBd: d ? '1px solid rgba(85,195,135,.5)' : open ? '1.5px solid #8e6a0d' : '1px solid transparent',
          btnFg: d ? '#257446' : open ? '#000000' : '#8d7975',
          tap: () => { if (open || d) { const done = s.done.slice(); done[i] = !d; this.setState({ done }); } } };
      })
    };
  }
}
</script>
</body>
</html>
