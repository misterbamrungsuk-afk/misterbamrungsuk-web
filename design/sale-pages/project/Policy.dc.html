<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>นโยบายร้านค้า</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Kanit:wght@500;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-variant-numeric:lining-nums}
a{color:#8e6a0d}a:hover{color:#866913}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #8e6a0d;outline-offset:2px}
.card{padding:14px;border-radius:16px;background:#faeef0;border:1px solid rgba(142,107,13,.38)}
.cta{height:52px;border-radius:14px;border:1px solid rgba(143,109,10,.85);background:linear-gradient(100deg, #f8e5e8 0%, #c8102e 24%, #990015 50%, #c8102e 76%, #f8e5e8 100%);box-shadow:0 8px 24px rgba(255,40,70,.45);color:#fff;font-size:15px;font-weight:600;width:100%;font-family: 'Cormorant Garamond', Kanit;display:grid;place-items:center;text-decoration:none;box-sizing:border-box}
.ghost{height:48px;border-radius:14px;border:1px solid rgba(142,107,13,.38);background:#faeef0;color:#8e6a0d;font-size:14px;font-weight:600;width:100%;display:grid;place-items:center;text-decoration:none;box-sizing:border-box}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#3b2b19}
.fi{height:48px;border-radius:14px;background:#faeef0;padding:0 14px;font-size:14px;text-align:left;width:100%;box-sizing:border-box}
.chip{min-height:40px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.eb{font-size:10.5px;letter-spacing:2.5px;color:#8e6a0d;font-weight:600}
.h{font-family: 'Cormorant Garamond', Kanit;font-weight:600}
.mut{color:#3b2b19}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid rgba(212,175,55,.55);background:rgba(142,107,13,.18);color:#8e6a0d;font-size:11px;font-weight:600}
.hrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sb{width:44px;height:44px;border-radius:12px;border:1px solid rgba(142,107,13,.38);background:#faeef0;color:#8e6a0d;font-size:18px}
*{font-variant-numeric:lining-nums}
</style>
</helmet>
<div style="width: 390px; height: 945px; background: linear-gradient(180deg, #fbf1f3 0%, #faecee 45%, #fbeef0 75%, #fcf2f5 100%); color: #170f04; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 15px; line-height: 1.7; position: relative; overflow: hidden">
  <header data-brand-bar style="position: relative; z-index: 30; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; height: 64px; box-sizing: border-box; background: #faf6f7"><a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; min-width: 0; font-family: 'Cormorant Garamond', Kanit; font-weight: 600; font-size: 20px"><img src="logo.png" alt="Mister Bamrungsuk" style="width: 40px; height: 40px; object-fit: contain; flex: 0 0 40px"><span style="color: #846215; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Mister Bamrungsuk</span></a><span style="flex: 0 0 auto; padding: 5px 12px; border-radius: 999px; border: 1px solid #8e6a0d; font-size: 10px; letter-spacing: 2.5px; color: #8e6a0d">PREMIUM</span></header>
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid rgba(142,107,13,.38); height: 77px; box-sizing: border-box">
    <a href="Market.dc.html" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(142,107,13,.38); display: grid; place-items: center; color: #170f04; text-decoration: none; flex: 0 0 44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div style="flex: 1; min-width: 0"><h1 style="margin: 0; font-family: Kanit, sans-serif; font-weight: 600; font-size: 20px">นโยบายร้านค้า</h1></div>
  </div>
  <div style="position: absolute; top: 141px; left: 0; right: 0; bottom: 0px; overflow-y: auto; padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
    <div role="tablist" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(252,245,247,.45); border: 1px solid rgba(142,107,13,.38)"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="flex: 1; min-height: 44px; border-radius: 10px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font-size: 13px; font-weight: 600">{{t.label}}</button></sc-for></div>
    <div class="card" style="font-size: 13px; color: #3b2b19; line-height: 1.6; background: #f9f7f5; border-color: rgba(141,114,24,.35)">{{intro}}</div>
    <sc-for list="{{secs}}" as="x" hint-placeholder-count="4">
      <div class="card" style="padding: 0; overflow: hidden">
        <button onClick="{{x.toggle}}" aria-expanded="{{x.exp}}" style="width: 100%; min-height: 52px; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 14px; border: 0; background: none; color: #170f04; text-align: left; font-size: 14px; font-weight: 600"><span>{{x.h}}</span><span style="color: #8e6a0d; font-size: 18px">{{x.icon}}</span></button>
        <sc-if value="{{x.open}}" hint-placeholder-val="{{ true }}"><div style="padding: 0 14px 14px; font-size: 13px; color: #3b2b19; line-height: 1.75; white-space: pre-line">{{x.body}}</div></sc-if>
      </div>
    </sc-for>
    <div style="font-size: 13px; color: #594836; line-height: 1.6">ปรับปรุงล่าสุด [รอกำหนด] · ร่างนี้ต้องให้ทนายตรวจก่อนเปิดใช้งาน</div>
    <div style="display: flex; gap: 8px"><a href="OrderTrack.dc.html" class="ghost" style="flex: 1">ติดตามคำสั่งซื้อ</a><a href="Market.dc.html" class="ghost" style="flex: 1">กลับ Marketplace</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":945}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'returns', open: { 0: true } }; }
  renderVals() {
    const s = this.state;
    const D = {
      returns: ['คืนสินค้าได้เมื่อสินค้าเสียหาย ผิดรายการ หรือไม่ตรงตามที่สั่ง · สินค้าประเภทรับประทานที่เปิดใช้แล้วคืนไม่ได้ด้วยเหตุผลด้านสุขอนามัย', [
        ['ระยะเวลาแจ้งคืน', 'แจ้งภายใน [รอกำหนด] วันนับจากวันที่ได้รับสินค้า\nพร้อมวิดีโอตอนเปิดกล่องและรูปสินค้า'],
        ['เงื่อนไขสินค้าที่คืนได้', '• สินค้าชำรุด แตก หรือหมดอายุ\n• ได้รับสินค้าผิดรายการหรือผิดจำนวน\n• ซีลยังไม่ถูกเปิด (กรณีเปลี่ยนใจ) [รอกำหนด]'],
        ['วิธีขอคืน', '1. ไปที่ "ติดตามคำสั่งซื้อ" แล้วกด "แจ้งปัญหา"\n2. แนบรูป/วิดีโอ\n3. ร้านและแอดมินตอบกลับภายใน [รอกำหนด] วันทำการ'],
        ['การคืนเงิน', 'โอนคืนเข้าบัญชีผู้ซื้อภายใน [รอกำหนด] วันทำการหลังร้านรับสินค้าคืน · ค่าส่งคืน: [รอกำหนด]']
      ]],
      shipping: ['จัดส่งทั่วประเทศ · แพ็กมิดชิดทุกออเดอร์ (กล่องสีพื้น ไม่ระบุชื่อสินค้าหรือชื่อร้านบนหน้ากล่อง)', [
        ['ระยะเวลาจัดส่ง', 'ร้านแพ็กและส่งภายใน [รอกำหนด] วันทำการหลังแอดมินยืนยันสลิป\nขนส่งใช้เวลาประมาณ 1–3 วันทำการ'],
        ['ค่าจัดส่ง', 'ค่าส่งมาตรฐาน ฿50 [รอกำหนด]\nส่งฟรีเมื่อซื้อครบ ฿1,500 [รอกำหนด]'],
        ['ขนส่งที่ใช้', 'Flash Express · Kerry · ไปรษณีย์ไทย [รอกำหนด]\nเลขพัสดุจะส่งทาง SMS เมื่อร้านจัดส่ง'],
        ['พื้นที่ห่างไกล', 'บางพื้นที่อาจมีค่าส่งเพิ่ม [รอกำหนด]']
      ]],
      privacy: ['เราเก็บข้อมูลเท่าที่จำเป็นต่อการจัดส่งและติดต่อเรื่องคำสั่งซื้อ ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล (PDPA)', [
        ['ข้อมูลที่เก็บ', 'ชื่อผู้รับ · ที่อยู่จัดส่ง · เบอร์มือถือ · รายการสั่งซื้อ · สลิปการโอน'],
        ['การแชร์ข้อมูล', 'แชร์ชื่อ ที่อยู่ และเบอร์ให้ร้านค้าและบริษัทขนส่งเพื่อจัดส่งเท่านั้น · ไม่ขายข้อมูลให้บุคคลอื่น'],
        ['ระยะเวลาเก็บ', 'เก็บไว้ [รอกำหนด] ปีตามกฎหมายบัญชี แล้วลบหรือทำให้ไม่ระบุตัวตน'],
        ['สิทธิของคุณ', 'ขอดู แก้ไข หรือลบข้อมูลได้ที่ [อีเมล/ช่องทาง รอกำหนด]\nผู้ควบคุมข้อมูล: บริษัท [ชื่อบริษัท รอกำหนด]']
      ]]
    };
    const T = [['returns', 'คืนสินค้า'], ['shipping', 'การจัดส่ง'], ['privacy', 'ความเป็นส่วนตัว']];
    const cur = D[s.tab];
    return {
      tabs: T.map(([k, label]) => ({ label, sel: s.tab === k ? 'true' : 'false', bg: s.tab === k ? '#b0182c' : 'transparent', fg: s.tab === k ? '#000000' : '#3b2b19', pick: () => this.setState({ tab: k, open: { 0: true } }) })),
      intro: cur[0],
      secs: cur[1].map(([h, body], i) => { const on = !!s.open[i]; return { h, body, open: on, exp: on ? 'true' : 'false', icon: on ? '−' : '+', toggle: () => { const open = Object.assign({}, s.open); open[i] = !on; this.setState({ open }); } }; })
    };
  }
}
</script>
</body>
</html>
