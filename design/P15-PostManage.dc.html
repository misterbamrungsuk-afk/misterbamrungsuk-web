<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>จัดการโพสต์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a0a;--s1:#181212;--s2:#21191a;--ln:#33272a;--red:#b0182c;--gold:#D4AF37;--gold-l:#e3c35c;--tx:#f6efe4;--mut:#ab9d94}
body{margin:0;font-family:'IBM Plex Sans Thai',sans-serif;background:var(--bg);color:var(--tx)}
*{box-sizing:border-box}
h1{font-family:'Kanit',sans-serif;margin:0}
button,input,textarea,select{font-family:inherit}
a{color:var(--tx);text-decoration:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fl{display:flex;flex-direction:column;gap:6px}
.lb{font-size:13px;color:var(--mut)}
.in{height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--s1);padding:0 14px;font-size:15px;color:var(--tx);width:100%}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);font-size:13px}
.chip.on{border-color:var(--gold);color:var(--gold-l);background:rgba(212,175,55,.08)}
.ph{aspect-ratio:3/4;border-radius:14px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
</style>
</helmet>
<div style="width:390px;height:1200px;position:relative;overflow:hidden;background:var(--bg)">
  <div style="display:flex;align-items:center;gap:10px;padding:16px">
    <a href="Provider.dc.html" aria-label="ย้อนกลับ" style="width:42px;height:42px;border-radius:42px;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="font-size:19px;font-weight:600">โพสต์ของฉัน</h1>
    <span style="margin-left:auto;font-size:12px;color:var(--mut)">โพสต์ได้บัญชีละ 1 โพสต์</span>
  </div>
  <div style="padding:0 16px;display:flex;flex-direction:column;gap:18px">
    <div style="background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px">
      <span style="width:8px;height:8px;border-radius:8px;background:#2FBF71"></span>
      <div style="flex-grow:1;font-size:14px">เผยแพร่อยู่ · หมดอายุใน 12 วัน</div>
      <button style="height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold-l);font-size:12px">ต่ออายุ 30 วัน</button>
    </div>
    <div class="fl"><span class="lb">รูปภาพ · สูงสุด 6 รูป</span>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <div class="ph"><img src="/_blob/ec33c74147cab066783e7acae85c8875" alt=""><span style="position:absolute;left:6px;top:6px;height:20px;padding:0 7px;border-radius:6px;background:var(--red);font-size:10px;font-weight:600;display:flex;align-items:center">ปก</span></div>
        <div class="ph"><img src="/_blob/82a15fdc40050c0a074e7e4b5b66e794" alt=""></div>
        <div class="ph" style="border:1px dashed var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold)"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
      </div>
    </div>
    <label class="fl"><span class="lb">หัวข้อ</span><button type="button" class="in" onClick="{{title.tap}}" aria-label="หัวข้อโพสต์ · แตะเพื่อกรอกตัวอย่าง" style="display:flex;align-items:center;justify-content:flex-start;text-align:left;cursor:pointer;box-sizing:border-box;font-family:inherit;overflow:hidden;white-space:nowrap;color:{{title.color}}">{{title.text}}</button></label>
    <div><p class="lb" style="margin: 0 0 6px">กิจกรรมที่รับ · {{actCount}}</p>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px">
              <sc-for list="{{actOn}}" as="a" hint-placeholder-count="4"><button onClick="{{a.remove}}" aria-label="{{a.aria}}" style="min-height: 40px; padding: 0 10px 0 14px; border-radius: 999px; border: 1px solid #d4af37; background: rgba(212,175,55,.12); color: #e3c35c; font-size: 13px; display: flex; align-items: center; gap: 6px">{{a.label}}<span style="font-size: 16px; line-height: 1">×</span></button></sc-for>
            </div>
            <div class="in" style="gap: 8px; border-color: #d4af37; display: flex; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ab9d94" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="flex: 1; color: {{qColor}}">{{qText}}</span></div>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 11.5px"><span style="color: #ab9d94">ลองพิมพ์:</span><sc-for list="{{qPresets}}" as="k" hint-placeholder-count="6"><button onClick="{{k.pick}}" style="height: 30px; padding: 0 10px; border-radius: 99px; border: 1px solid {{k.bd}}; background: transparent; color: {{k.fg}}; font-size: 11.5px">{{k.label}}</button></sc-for></div>
            <div style="margin-top: 8px; border-radius: 12px; border: 1px solid #33272a; background: #181212; overflow: hidden; display: flex; flex-direction: column">
              <sc-for list="{{sugg}}" as="g" hint-placeholder-count="4"><button onClick="{{g.add}}" style="min-height: 44px; padding: 0 14px; border: 0; border-bottom: 1px solid #21191a; background: transparent; color: #f6efe4; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; text-align: left">{{g.label}}<span style="color: #e3c35c; font-size: 12px">+ เลือก</span></button></sc-for>
              <sc-if value="{{noSugg}}" hint-placeholder-val="{{ false }}"><div style="padding: 10px 14px; font-size: 12px; color: #ab9d94">ไม่พบในรายการแนะนำ</div></sc-if>
              <sc-if value="{{showCustom}}" hint-placeholder-val="{{ true }}"><button onClick="{{addCustom}}" style="min-height: 44px; padding: 0 14px; border: 0; background: rgba(212,175,55,.08); color: #e3c35c; font-size: 13.5px; font-weight: 600; text-align: left">{{customLabel}}</button></sc-if>
            </div>
          </div>
          <div><p class="lb" style="margin: 0 0 6px">สถานที่ที่รับนัด · {{placeCount}}</p>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{places}}" as="pl" hint-placeholder-count="7"><button onClick="{{pl.toggle}}" aria-pressed="{{pl.on}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{pl.bd}}; background: {{pl.bg}}; color: {{pl.fg}}; font-size: 13px">{{pl.label}}</button></sc-for>
            </div>
            <p class="lb" style="margin: 12px 0 6px">สปา / สถานที่พาร์ทเนอร์</p>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{pspas}}" as="sp" hint-placeholder-count="3"><button onClick="{{sp.toggle}}" style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid {{sp.bd}}; background: #181212; color: #f6efe4; display: flex; align-items: center; gap: 10px; text-align: left"><span style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #d4af37; background: {{sp.box}}; color: #1a1206; display: grid; place-items: center; font-size: 12px; font-weight: 700">{{sp.mark}}</span><span style="flex: 1; font-size: 13.5px">{{sp.name}}</span><span style="font-size: 12px; color: #ab9d94">{{sp.area}}</span></button></sc-for>
            </div>
          </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <label class="fl"><span class="lb">ราคา 3 ชม.</span><button type="button" class="in" onClick="{{price.tap}}" aria-label="price · แตะเพื่อกรอกตัวอย่าง" style="display:flex;align-items:center;justify-content:flex-start;text-align:left;cursor:pointer;box-sizing:border-box;font-family:inherit;overflow:hidden;white-space:nowrap;color:{{price.color}}">{{price.text}}</button></label>
      <label class="fl"><span class="lb">ช่วงเวลา</span><select class="in"><option>3 ชม. / 5 ชม.</option></select></label>
      <label class="fl"><span class="lb">พื้นที่</span><select class="in"><option>กรุงเทพฯ</option></select></label>
    </div>
    <label class="fl"><span class="lb">กติกา (แก้ไขได้)</span><button type="button" class="in" onClick="{{rules.tap}}" aria-label="rules · แตะเพื่อกรอกตัวอย่าง" style="display:flex;align-items:flex-start;justify-content:flex-start;text-align:left;cursor:pointer;box-sizing:border-box;font-family:inherit;overflow:hidden;white-space:pre-wrap;height:118px;padding:12px 14px;line-height:1.55;resize:none; color:{{rules.color}}">{{rules.text}}</button></label>
    <label style="display:flex;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;font-size:14px">ซ่อนโพสต์ชั่วคราว<span style="width:48px;height:28px;border-radius:28px;background:var(--ln);position:relative;display:inline-block"><span style="position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:22px;background:var(--mut)"></span></span></label>
    <div style="display:flex;gap:10px">
      <button style="height:54px;padding:0 18px;border-radius:16px;border:1px solid var(--ln);background:transparent;color:var(--tx);font-weight:500">ดูตัวอย่าง</button>
      <button style="flex-grow:1;height:54px;border-radius:16px;border:0;background:var(--red);color:#fff;font-family:'Kanit';font-weight:600;font-size:16px">บันทึกโพสต์</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { picked: ['กิน & เที่ยว', 'ช่างภาพ', 'คาเฟ่', 'นั่งชิล'], q: 'ดู', places: ['ห้างสรรพสินค้า', 'คาเฟ่ / ร้านอาหาร', 'สปา'], pspa: [0] }; }
_baseVals() {
    const s = this.state; const set = (o) => this.setState(o);
    const SUG = ['กิน & เที่ยว', 'ช่างภาพ', 'ออกกำลัง', 'คาเฟ่', 'วิดีโอคอล', 'ดูหนัง', 'นั่งชิล', 'ช้อปปิ้ง', 'ตีกอล์ฟ', 'คาราโอเกะ', 'ดินเนอร์', 'เที่ยวต่างจังหวัด', 'คอนเสิร์ต', 'ฟิตเนส', 'ว่ายน้ำ', 'เดินเล่นสวน'];
    const QP = ['', 'ดู', 'ตี', 'คอน', 'เที่ยว', 'โยคะ'];
    const PLACES = ['นอกสถานที่', 'กลางแจ้ง', 'ห้างสรรพสินค้า', 'คาเฟ่ / ร้านอาหาร', 'คอนโด', 'โรงแรม', 'สปา'];
    const PSPA = [['Siam Serenity Spa', 'สุขุมวิท 31'], ['Lanna Retreat', 'เชียงใหม่'], ['Baan Suan Spa', 'อารีย์']];
    const q = s.q; const picked = s.picked;
    const actVals = {
      actCount: 'เลือกแล้ว ' + picked.length,
      actOn: picked.map((label) => ({ label, aria: 'ลบ ' + label, remove: () => set({ picked: picked.filter((x) => x !== label) }) })),
      qText: q || 'พิมพ์กิจกรรม เช่น ดูหนัง, ตีกอล์ฟ…', qColor: q ? '#f6efe4' : '#7d6d6a',
      qPresets: QP.map((v) => ({ label: v || 'ล้าง', bd: s.q === v ? '#d4af37' : '#33272a', fg: s.q === v ? '#e3c35c' : '#ab9d94', pick: () => this.setState({ q: v }) })),
      sugg: SUG.filter((x) => !picked.includes(x) && (!q || x.includes(q))).slice(0, 6).map((label) => ({ label, add: () => set({ picked: [...picked, label], q: '' }) })),
      noSugg: !!q && !SUG.some((x) => !picked.includes(x) && x.includes(q)),
      showCustom: !!q && !SUG.includes(q) && !picked.includes(q),
      customLabel: '+ เพิ่ม “' + q + '”', addCustom: () => set({ picked: [...picked, q], q: '' }),
      placeCount: 'เลือกแล้ว ' + s.places.length,
      places: PLACES.map((label) => { const on = s.places.includes(label); return { label, on: String(on), bd: on ? '#d4af37' : '#33272a', bg: on ? 'rgba(212,175,55,.12)' : '#181212', fg: on ? '#e3c35c' : '#ab9d94', toggle: () => set({ places: on ? s.places.filter((x) => x !== label) : [...s.places, label] }) }; }),
      pspas: PSPA.map(([name, area], i) => { const on = s.pspa.includes(i); return { name, area, mark: on ? '✓' : '', box: on ? '#d4af37' : 'transparent', bd: on ? '#d4af37' : '#33272a', toggle: () => set({ pspa: on ? s.pspa.filter((x) => x !== i) : [...s.pspa, i] }) }; })
    };
    return actVals;
}

  _fields() { return {"title":{"v":["เพื่อนกินเที่ยว คาเฟ่ ถ่ายรูปสวย ดูแลตลอดนัด","เพื่อนเที่ยวสายคาเฟ่ ถ่ายรูปให้ฟรี",""],"ph":"หัวข้อโพสต์","on":"var(--tx)","mask":false},"price":{"v":["฿2,400","฿2,700","฿2,100"],"ph":"","on":"var(--tx)","mask":false},"rules":{"v":["1. ไม่มีบริการทางเพศทุกรูปแบบ\n2. นัดเจอในที่สาธารณะ ที่พักของลูกค้า (คอนโด/โรงแรม) หรือสปาพาร์ทเนอร์ ตามที่ลูกค้าเลือก\n3. ยกเลิกก่อนนัด 3 ชม. คืนเงินเต็มจำนวน","1. ไม่มีบริการทางเพศทุกรูปแบบ\n2. นัดเจอในที่สาธารณะเท่านั้น\n3. ยกเลิกก่อนนัด 6 ชม. คืนเงินเต็มจำนวน"],"ph":"","on":"var(--tx)","mask":false}}; }
  fv(k) { const F = this._fields()[k]; const fx = (this.state && this.state.fx) || {}; const v = F.v[(fx[k] || 0) % F.v.length]; return v.indexOf('HOLE:') === 0 ? String((this._hole || {})[v.slice(5)] || '') : v; }
  renderVals() {
    const r = this._baseVals(); this._hole = r; const fx = (this.state && this.state.fx) || {}; const F = this._fields();
    Object.keys(F).forEach((k) => {
      const v = this.fv(k), c = F[k];
      const o = { text: v ? (c.mask ? '\u2022'.repeat(v.length) : v) : c.ph, color: v ? c.on : '#7d6d6a', tap: () => this.setState({ fx: Object.assign({}, fx, { [k]: ((fx[k] || 0) + 1) % c.v.length }) }) };
      for (let i = 0; i < 6; i++) o['d' + i] = v[i] || '\u2013';
      r[k] = o;
    });
    return r;
  }
}
</script>
</body>
</html>
