<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แก้ไขโปรไฟล์</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a0a;--s1:#181212;--s2:#21191a;--ln:#33272a;--red:#b0182c;--gold:#D4AF37;--gold-l:#e3c35c;--tx:#f6efe4;--mut:#ab9d94}
body{margin:0;font-family:'IBM Plex Sans Thai',sans-serif;background:var(--bg);color:var(--tx)}
*{box-sizing:border-box}
h1{font-family:'Kanit',sans-serif;margin:0}

a{color:var(--tx);text-decoration:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.fl{display:flex;flex-direction:column;gap:6px}
.lb{font-size:13px;color:var(--mut)}
.in{height:48px;border-radius:14px;border:1px solid var(--ln);background:var(--s1);padding:0 14px;font-size:15px;color:var(--tx);width:100%}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg)">
  <div style="display:flex;align-items:center;gap:10px;padding:16px">
    <a href="S13-Account.dc.html" aria-label="ย้อนกลับ" style="width:42px;height:42px;border-radius:42px;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="font-size:19px;font-weight:600">แก้ไขโปรไฟล์</h1>
  </div>
  <div style="padding:0 16px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:14px"><div style="width:68px;height:68px;border-radius:68px;border:1px solid var(--gold);color:var(--gold-l);font-family:'Kanit';font-size:28px;display:flex;align-items:center;justify-content:center">ม</div><button style="height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ln);background:transparent;color:var(--tx);font-size:13px">เปลี่ยนรูป</button></div>
    <label class="fl"><span class="lb">ชื่อที่แสดง</span><button type="button" class="in" onClick="{{name.tap}}" aria-label="name · แตะเพื่อกรอกตัวอย่าง" style="display:flex;align-items:center;justify-content:flex-start;text-align:left;cursor:pointer;box-sizing:border-box;font-family:inherit;overflow:hidden;white-space:nowrap;color:{{name.color}}">{{name.text}}</button></label>
    <label class="fl"><span class="lb">เบอร์โทร (เพื่อนจะไม่เห็นเบอร์คุณ)</span><button type="button" class="in" onClick="{{tel.tap}}" aria-label="tel · แตะเพื่อกรอกตัวอย่าง" style="display:flex;align-items:center;justify-content:flex-start;text-align:left;cursor:pointer;box-sizing:border-box;font-family:inherit;overflow:hidden;white-space:nowrap;color:{{tel.color}}">{{tel.text}}</button></label>
    <label class="fl"><span class="lb">อีเมล</span><button type="button" class="in" onClick="{{email.tap}}" aria-label="email · แตะเพื่อกรอกตัวอย่าง" style="display:flex;align-items:center;justify-content:flex-start;text-align:left;cursor:pointer;box-sizing:border-box;font-family:inherit;overflow:hidden;white-space:nowrap;color:{{email.color}}">{{email.text}}</button></label>
    <div style="margin-top:6px;padding:16px;border-radius:18px;border:1px solid var(--red);background:rgba(224,36,60,.05);display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:8px;align-items:center"><svg class="ic" viewBox="0 0 24 24" style="color:#FF8A97"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h0"/></svg><b style="font-family:'Kanit';font-weight:500">ผู้ติดต่อฉุกเฉิน</b></div>
      <div style="font-size:12px;color:var(--mut)">เมื่อคุณกด SOS คนนี้จะได้รับตำแหน่งของคุณทันที</div>
      <button type="button" class="in" onClick="{{ecName.tap}}" aria-label="ชื่อผู้ติดต่อฉุกเฉิน · แตะเพื่อกรอกตัวอย่าง" style="display:flex;align-items:center;justify-content:flex-start;text-align:left;cursor:pointer;box-sizing:border-box;font-family:inherit;overflow:hidden;white-space:nowrap;background:var(--s2); color:{{ecName.color}}">{{ecName.text}}</button>
      <div style="display:flex;gap:8px"><button type="button" class="in" onClick="{{ecTel.tap}}" aria-label="เบอร์ผู้ติดต่อ · แตะเพื่อกรอกตัวอย่าง" style="display:flex;align-items:center;justify-content:flex-start;text-align:left;cursor:pointer;box-sizing:border-box;font-family:inherit;overflow:hidden;white-space:nowrap;background:var(--s2);flex:1.4; color:{{ecTel.color}}">{{ecTel.text}}</button><select class="in" aria-label="ความสัมพันธ์" style="background:var(--s2);flex:1"><option>พี่สาว</option></select></div>
    </div>
  </div>
  <button style="position:absolute;left:16px;right:16px;bottom:24px;height:56px;border-radius:16px;border:0;background:var(--red);color:#fff;font-family:'Kanit';font-weight:600;font-size:17px">บันทึก</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

</body>
</html>
