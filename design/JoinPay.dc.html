<!doctype html>
<html lang="th">

<title>ชำระค่าสมัคร</title>

<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#e3c35c}a:hover{color:#eed58a}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #d4af37;outline-offset:2px}
.h{font-family:Kanit;font-weight:600}
.card{padding:14px;border-radius:16px;background:#181212;border:1px solid #33272a}
.in{height:48px;border-radius:12px;border:1px solid #33272a;background:#21191a;color:#f6efe4;padding:0 14px;font-size:14px;box-sizing:border-box;width:100%;display:flex;align-items:center}
.cta{height:52px;border-radius:14px;border:1px solid rgba(212,175,55,.45);background:linear-gradient(180deg,#c21d33,#8f1424);color:#fff;font-size:15px;font-weight:600;width:100%;font-family:Kanit}
.ghost{height:48px;border-radius:14px;border:1px solid #33272a;background:#181212;color:#e3c35c;font-size:14px;font-weight:600;width:100%}
.lbl{font-size:12px;color:#ab9d94;margin:0 0 6px}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pkg: 'B', sec: 900, slip: false, step: 'pay' }; this.t = setInterval(() => { if (this.state.sec > 0 && this.state.step === 'pay') this.setState({ sec: this.state.sec - 1 }); }, 1000); }
  renderVals() {
    const s = this.state; const P = { A: 13000, B: 21000 };
    const fmt = (n) => '฿' + n.toLocaleString('en-US');
    const mm = String(Math.floor(s.sec / 60)).padStart(2, '0'); const ss = String(s.sec % 60).padStart(2, '0');
    return {
      pkgs: [['A', 'แพ็กเกจ A · การันตี ฿10,000 + อบรม ฿3,000'], ['B', 'แพ็กเกจ B · การันตี ฿15,000 + อบรม ฿6,000']].map(([id, name]) => ({ name, price: fmt(P[id]), bd: s.pkg === id ? '#d4af37' : '#33272a', bg: s.pkg === id ? 'rgba(212,175,55,.08)' : '#181212', pick: () => this.setState({ pkg: id }) })),
      summary: [['ผู้สมัคร', 'นายพงศกร ร. (ต้น)'], ['รุ่นอบรม', 'รุ่น 1 · 15–16 พ.ย. 2569'], ['รายการ', s.pkg === 'A' ? 'การันตี ฿10,000 + อบรม ฿3,000' : 'การันตี ฿15,000 + อบรม ฿6,000'], ['สิ่งที่ได้', s.pkg === 'A' ? 'อบรมบุคลิกภาพ มารยาท การดูแลลูกค้า · ฟรีสมาชิก 6 เดือน แล้ว ฿3,500/6 เดือน' : 'อบรมบุคลิกภาพ + มาตรฐานการนวด · ยูนิฟอร์ม + น้ำมันนวด 1 ชุด · ฟรีสมาชิก 6 เดือน แล้ว ฿5,000/6 เดือน'], ['การันตี', 'คืนเต็มจำนวนเมื่อครบ 1 ปี หากไม่ทำผิดกฎ/กฎหมาย และไม่ปฏิเสธลูกค้า']].map(([n, v]) => ({ n, v })),
      total: fmt(P[s.pkg]),
      paying: s.step === 'pay', pending: s.step === 'pending',
      countdown: mm + ':' + ss, cdColor: s.sec < 120 ? '#ef6b7b' : '#e3c35c', expired: s.sec === 0, qrOp: s.sec === 0 ? '.2' : '1',
      refresh: () => this.setState({ sec: 900 }),
      upload: () => this.setState({ slip: !s.slip }),
      slipLabel: s.slip ? 'slip_kbank_0610.jpg · แตะเพื่อเปลี่ยน' : 'แตะเพื่อเลือกรูปสลิป (JPG/PNG)',
      slipBd: s.slip ? '#4cc283' : '#33272a', slipFg: s.slip ? '#7fd6a3' : '#ab9d94',
      submitOp: s.slip ? '1' : '.45', submit: () => { if (s.slip) this.setState({ step: 'pending' }); },
      back: () => this.setState({ step: 'pay', slip: false })
    };
  }
}
</script>
